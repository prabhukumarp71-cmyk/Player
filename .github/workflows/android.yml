name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Environment Files
        run: |
          if [ ! -f .env.example ]; then
            echo "# Default secrets placeholder" > .env.example
          fi
          if [ ! -f .env ]; then
            touch .env
          fi
          mkdir -p app/src/main/res/xml
          if [ ! -f app/src/main/res/xml/backup_rules.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content/>' > app/src/main/res/xml/backup_rules.xml
          fi
          if [ ! -f app/src/main/res/xml/data_extraction_rules.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup/><device-transfer/></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          fi
          mkdir -p app/src/main/res/values
          if [ ! -f app/src/main/res/values/themes.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.MyApplication" parent="@android:style/Theme.Material.NoActionBar"/></resources>' > app/src/main/res/values/themes.xml
          fi

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Player-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
